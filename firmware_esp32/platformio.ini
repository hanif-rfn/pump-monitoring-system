[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

; Skema partisi memori agar muat untuk biner besar (Firebase + TLS)
board_build.partitions = huge_app.csv

; Kecepatan komunikasi Serial Monitor & upload via kabel USB
monitor_speed = 115200
upload_speed = 460800

; Fitur pembaca exception & timestamp pada serial monitor
monitor_filters = esp32_exception_decoder, time

lib_deps = 
    mobizt/Firebase ESP32 Client @ ^4.4.14
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    mandulaj/PZEM-004T-v30 @ ^1.1.2